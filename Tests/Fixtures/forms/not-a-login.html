<!doctype html>
<title>A shop</title>
<header>
  <input id="search" type="text" name="q" placeholder="Search for users by email" style="width: 300px">
</header>
<form id="pay" action="#">
  <input id="number" type="text" name="cardnumber" autocomplete="cc-number" placeholder="Card number" style="width: 300px">
  <input id="holder-email" type="text" name="card_email" placeholder="Card holder's login" style="width: 300px">
  <input id="cvv" type="password" name="cvv" maxlength="4" style="width: 100px">
  <input id="code" type="text" name="login_otp" autocomplete="one-time-code" style="width: 100px">
  <input id="digit" type="text" name="email-code" maxlength="1" style="width: 40px">
  <button>Pay</button>
</form>
<footer>
  <form action="#">
    <input id="letter" type="email" name="email" placeholder="Your email" style="width: 300px">
    <button>Go</button>
  </form>
</footer>
