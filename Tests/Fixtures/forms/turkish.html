<!doctype html>
<title>Giriş yap</title>
<form id="login" action="#">

  <label for="secret">Şifre</label>
  <input id="secret" type="password" name="f2" style="width: 300px">
  <button>Giriş yap</button>
</form>
<form id="contact" action="#">
  <input id="address" type="text" name="f3" placeholder="E-POSTA ADRESİNİZ" style="width: 300px">
  <button>Gönder</button>
</form>
<form id="find" action="#">
  <input id="search" type="text" name="f4" placeholder="Site içinde ara" style="width: 300px">
</form>
<form id="code" action="#">
  <label for="sms">Doğrulama kodu</label>
  <input id="sms" type="text" name="login-kodu" style="width: 300px">
</form>
