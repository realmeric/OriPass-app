<!doctype html>
<title>Change your password</title>
<form id="form" method="post" action="home.html">
  <input id="old" type="password" name="current" autocomplete="current-password" style="width: 300px">
  <input id="password" type="password" name="new" autocomplete="new-password" style="width: 300px">
  <input id="again" type="password" name="confirm" autocomplete="new-password" style="width: 300px">
  <button id="send">Change password</button>
</form>
