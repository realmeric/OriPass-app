<!doctype html>
<title>The browser's own buttons</title>
<style>
  form { margin: 6px }
  input { width: 300px; height: 30px; font: 14px monospace }
</style>
<form><input id="key" data-button="1" type="email" name="email"></form>
<form><input id="plain-key" type="email" name="email"></form>
<form><input id="key-long" data-button="1" type="email" name="email" value="kanarya-a-long-address-that-runs-past-the-edge-of-its-field@example.test"></form>
<form><input id="plain-key-long" type="email" name="email" value="kanarya-a-long-address-that-runs-past-the-edge-of-its-field@example.test"></form>
<form><input id="strong" data-button="3" type="password" name="password"></form>
<form><input id="plain-strong" type="password" name="password"></form>
<form><input id="contacts" data-button="2" type="text" name="city"></form>
<form><input id="plain-contacts" type="text" name="city"></form>
