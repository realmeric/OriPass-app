<!doctype html>
<title>Create your account</title>
<form id="form" method="post" action="home.html">
  <input id="name" type="text" name="fullname" style="width: 300px">
  <input id="username" type="email" name="email" style="width: 300px">
  <input id="password" type="password" name="password" autocomplete="new-password" style="width: 300px">
  <input id="again" type="password" name="confirm" autocomplete="new-password" style="width: 300px">
  <button id="send">Create account</button>
</form>
